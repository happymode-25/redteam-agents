name: redteam-agents CI

# Fully offline pipeline: unit + adversarial scope tests only.
# No target traffic, no LLM API keys, no external scanner binaries.
on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q redteam main.py eval tests

      - name: Unit + adversarial scope suite
        run: python -m unittest discover -s tests -v

      # Replay-mode eval runs here once cassettes are committed for a golden
      # target:  python eval/run_eval.py --config config.yaml --target <t> --mode replay
